<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;color:#f2f2f4;-webkit-font-smoothing:antialiased}
.mono{font-family:'SF Mono','JetBrains Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;color:#c4c4cc;text-decoration:none}
.nav.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.nav.on .ico{color:#9aa4ff}
.chip{font-size:11px;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.08);color:#c4c4cc}
</style>
</helmet>
<div style="width:210px;min-height:820px;box-sizing:border-box;background:#232326;border-right:1px solid rgba(255,255,255,.07);padding:14px 12px;display:flex;flex-direction:column;gap:2px">
  <div style="display:flex;gap:8px;padding:0 4px 18px"><span style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:50%;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:50%;background:#28c840"></span></div>
  <div class="{{cServer}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4.5" rx="1.8"/><rect x="2" y="9" width="12" height="4.5" rx="1.8"/><path d="M4.9 4.75h.01M4.9 11.25h.01" stroke-width="2"/></svg>Server</div>
  <div class="{{cLibrary}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5.5 3-5.5 3-5.5-3z"/><path d="M2.5 8L8 11l5.5-3"/><path d="M2.5 11L8 14l5.5-3"/></svg>Library<span class="chip" style="margin-left:auto">6</span></div>
  <div class="{{cDiscover}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7.2" cy="7.2" r="4.7"/><path d="M10.8 10.8L14 14"/></svg>Discover</div>
  <div class="{{cAdvisor}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5l1.3 3.2L11.5 7 8.3 8.3 7 11.5 5.7 8.3 2.5 7l3.2-1.3z"/><path d="M12.5 10.5v3M11 12h3"/></svg>Advisor</div>
  <div class="{{cMemory}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="2"/><rect x="6.5" y="6.5" width="3" height="3" rx=".8"/><path d="M6 1.5v2M10 1.5v2M6 12.5v2M10 12.5v2M1.5 6h2M1.5 10h2M12.5 6h2M12.5 10h2"/></svg>Memory</div>
  <div class="{{cUsage}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="8" width="2.5" height="5.5" rx="1"/><rect x="6.75" y="3" width="2.5" height="10.5" rx="1"/><rect x="11" y="6" width="2.5" height="7.5" rx="1"/></svg>Usage</div>
  <div class="{{cPlay}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3h9A1.5 1.5 0 0 1 14 4.5v5a1.5 1.5 0 0 1-1.5 1.5H8l-3 2.5V11H3.5A1.5 1.5 0 0 1 2 9.5v-5A1.5 1.5 0 0 1 3.5 3z"/></svg>Playground</div>
  <div class="{{cLogs}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2.5"/><path d="M5 6.5l2 1.5-2 1.5M8.5 10h2.5"/></svg>Logs</div>
  <div class="{{cSettings}}"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h6M11.5 5h2M2.5 11h2M7.5 11h6"/><circle cx="10" cy="5" r="1.7"/><circle cx="6" cy="11" r="1.7"/></svg>Settings</div>
  <div style="flex:1"></div>
  <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px">
    <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#4ade9b"><span style="width:7px;height:7px;border-radius:50%;background:#4ade9b"></span>Running</span>
    <span style="font-size:12px;color:#c4c4cc">Qwen3-30B-A3B-4bit</span>
    <span class="mono" style="font-size:11px;color:#9a9aa4">127.0.0.1:8080</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"server"},"$preview":{"width":210,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'server';
    const c = (k) => (a === k ? 'nav on' : 'nav');
    return { cServer: c('server'), cLibrary: c('library'), cDiscover: c('discover'), cAdvisor: c('advisor'), cMemory: c('memory'), cUsage: c('usage'), cPlay: c('playground'), cLogs: c('logs'), cSettings: c('settings') };
  }
}
</script>
</body>
</html>
